name: Jekyll build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify publication listings
        run: |
          ruby -e '
            about = File.read("_site/index.html")
            publications = File.read("_site/publications/index.html")
            titles = Dir.glob("_publications/*.md").map { |file| File.read(file)[/title: "(.*)"/, 1] }
            abort "A publication is missing from the about page" unless titles.all? { |title| about.include?(title) }
            abort "A publication is missing from the publications page" unless titles.all? { |title| publications.include?(title) }
            puts "All #{titles.size} publications appear on both the about page and the publications page."
          '
